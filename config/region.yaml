region:
  name: "Arabian Sea Monitored Sector"
  bounds: [59.0, 14.5, 70.0, 22.0]

gateways:
  - gateway_id: "GATE_A"
    name: "Gate Alpha — Western Corridor"
    orientation: "west"
    entry_side: "west"
    exit_side: "east"
    geometry_geojson:
      type: "Polygon"
      coordinates:
        - - [58.8, 14.5]
          - [59.2, 14.5]
          - [59.2, 22.0]
          - [58.8, 22.0]
          - [58.8, 14.5]

  - gateway_id: "GATE_B"
    name: "Gate Bravo — Northern Corridor"
    orientation: "north"
    entry_side: "north"
    exit_side: "south"
    geometry_geojson:
      type: "Polygon"
      coordinates:
        - - [59.0, 21.8]
          - [70.0, 21.8]
          - [70.0, 22.2]
          - [59.0, 22.2]
          - [59.0, 21.8]

  - gateway_id: "GATE_C"
    name: "Gate Charlie — Southern Corridor"
    orientation: "south"
    entry_side: "south"
    exit_side: "north"
    geometry_geojson:
      type: "Polygon"
      coordinates:
        - - [59.0, 14.3]
          - [70.0, 14.3]
          - [70.0, 14.7]
          - [59.0, 14.7]
          - [59.0, 14.3]

  - gateway_id: "GATE_D"
    name: "Gate Delta — Eastern Corridor"
    orientation: "east"
    entry_side: "east"
    exit_side: "west"
    geometry_geojson:
      type: "Polygon"
      coordinates:
        - - [69.8, 14.5]
          - [70.2, 14.5]
          - [70.2, 22.0]
          - [69.8, 22.0]
          - [69.8, 14.5]

thresholds:
  ais_gap_minutes: 15.0
  rendezvous_m: 500.0
  rendezvous_kn: 3.0
  rendezvous_min: 20.0
  coordinated_dark_overlap_min: 10.0
  coordinated_dark_nm: 5.0
  z_sigma: 2.0
  traffic_high_percentile: 75.0
  traffic_bin_minutes: 60          # Fixed hourly bins (not sliding); deterministic, non-overlapping
  min_history_journeys: 5
  merkle_window_events: 100
  weather_wind_ms: 6.5             # ERA5 wind speed threshold for adverse conditions (m/s)
  vessel_max_speed_kn: 18.0        # Default max vessel speed for dark-path feasibility (knots)

vessel_class_baseline_speeds_kn:
  default: 12.0     # IMO average transit speed for mixed commercial vessels (IMO GHG Study 4)
  tanker: 11.5      # Typical laden crude/product tanker cruising baseline (DNV Maritime 2023)
  cargo: 13.5       # Container / general cargo reference speed
  fishing: 8.0      # Commercial trawler cruising baseline

vessel_class_max_speeds_kn:
  default: 18.0     # General commercial vessel upper bound
  tanker: 16.0      # Laden tanker max practical speed
  cargo: 20.0       # Container vessel max practical speed
  fishing: 12.0     # Trawler max practical speed
